name: Generate snake animation

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

  workflow_run:
    workflows: ["GitHub-Profile-Summary-Cards"]
    types: [completed]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?palette=github-dark
          from: "${{'now-365d'}}"
          to: "${{'now'}}"

      - name: crop snake.svg to the contribution grid
        run: sed -i -E '0,/<svg /s/viewBox="[^"]*" width="[0-9]+" height="[0-9]+"/viewBox="0 0 848 112" width="848" height="112"/' dist/snake.svg

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 